<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проверка мобильной вёрстки — Тёплый Контур</title>
<style>
  body { font: 13px/1.5 Consolas, monospace; margin: 16px; background: #fff; }
  h2 { font-size: 14px; margin: 18px 0 6px; }
  #log { background: #f5f5f5; padding: 10px; border: 1px solid #ddd; white-space: pre-wrap; margin-bottom: 12px; }
  iframe { width: 390px; height: 780px; border: 2px solid #333; background: #fff; }
</style>
</head>
<body>
<h1 style="font-size:15px">Проверка мобильной вёрстки: вьюпорт 390 px</h1>
<div id="log">загрузка…</div>

<!-- По одному статическому iframe на страницу: статический src надёжнее, чем srcdoc и动态 .src -->
<iframe src="../index.html"></iframe>
<iframe src="../catalog.html"></iframe>
<iframe src="../calc.html"></iframe>
<iframe src="../delivery.html"></iframe>
<iframe src="../about.html"></iframe>
<iframe src="../product.html?p=bytovka-6x3"></iframe>
<iframe src="../kp.html?p=bytovka-6x3"></iframe>
<iframe src="../404.html"></iframe>

<script>
  var log = document.getElementById("log");
  var frames = Array.prototype.slice.call(document.querySelectorAll("iframe"));
  var done = 0;

  function check(fr) {
    var d = fr.contentDocument, w = fr.contentWindow;
    if (!d || !d.body) return "нет доступа к документу";
    var cs = function (sel) { return d.querySelector(sel) ? w.getComputedStyle(d.querySelector(sel)) : null; };
    var res = {
      "скролл X": d.documentElement.scrollWidth + "/" + d.documentElement.clientWidth,
      "битых фото": Array.from(d.images).filter(function (i) {
        return i.getAttribute("src") && i.complete && i.naturalWidth === 0;
      }).length,
      "высота": d.body.scrollHeight,
      "бургер": cs(".burger") ? cs(".burger").display : "—",
      "липкая кнопка": cs(".sticky-cta") ? cs(".sticky-cta").display : "—"
    };
    if (cs(".calc__grid")) res["колонок калькулятора"] = cs(".calc__grid").gridTemplateColumns.split(" ").length;
    if (cs(".filters")) res["фильтры"] = cs(".filters").position;
    var wide = Array.from(d.querySelectorAll("table, .kp, .specs")).filter(function (t) {
      return t.getBoundingClientRect().width > d.documentElement.clientWidth;
    }).length;
    res["блоков шире экрана"] = wide;
    return res;
  }

  function show(fr) {
    var name = fr.getAttribute("src").replace("../", "");
    var r = check(fr);
    var line = name + "\n" + "   " + (typeof r === "string" ? r : JSON.stringify(r));
    log.textContent += (done ? "\n\n" : "") + line;
    done++;
  }

  frames.forEach(function (fr) {
    var tries = 0;
    var poll = setInterval(function () {
      var d = fr.contentDocument;
      tries++;
      if (d && d.readyState === "complete" && d.body && d.body.childElementCount >= 1) {
        clearInterval(poll);
        /* даём скриптам страницы отработать рендер карточек и калькулятор */
        setTimeout(function () {
          try { show(fr); } catch (e) { log.textContent += "\n" + name(fr) + " ОШИБКА: " + e.message; }
        }, 700);
      } else if (tries > 100) {
        clearInterval(poll);
        log.textContent += "\n" + name(fr) + " не догрузилась";
      }
    }, 100);
  });

  function name(fr) { return fr.getAttribute("src").replace("../", ""); }
</script>
</body>
</html>
